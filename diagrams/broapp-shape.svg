<svg xmlns="http://www.w3.org/2000/svg" width="660" height="352" viewBox="0 0 660 352" fill="none" role="img" aria-label="One Broapp application on one machine: the executable, holding the Bun runtime, your host code and the UI embedded as text, serves the single document to the browser over HTTP once; after that the browser calls the host over a WebSocket on the same origin and gets a result, and the host pushes stream events back on the same socket. Everything stays on 127.0.0.1 at an ephemeral port.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 9s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 9s; }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 14.44% { opacity: 1; } 15.56%, 100% { opacity: 0; } }
    /* m1: the one document, script and style inline, over http */
    @keyframes m1 {
      0%, 3.33% { transform: translate(0, 0); opacity: 0; }
      4% { opacity: 1; }
      10% { transform: translate(180px, 0px); opacity: 1; }
      11.33%, 100% { transform: translate(180px, 0px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 10% { transform: scale(0.4); opacity: 0; } 10.44% { transform: scale(0.5); opacity: 0.8; } 15.56%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 10% { opacity: 0; } 10.89% { opacity: 0.3; } 14.44%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 16.67% { opacity: 0; } 17.78%, 40% { opacity: 1; } 41.11%, 100% { opacity: 0; } }
    /* m2: the ui calls a typed operation over the websocket */
    @keyframes m2 {
      0%, 20% { transform: translate(0, 0); opacity: 0; }
      20.67% { opacity: 1; }
      25.56% { transform: translate(-180px, 0px); opacity: 1; }
      26.89%, 100% { transform: translate(-180px, 0px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 25.56% { transform: scale(0.4); opacity: 0; } 26% { transform: scale(0.5); opacity: 0.8; } 31.11%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 25.56% { opacity: 0; } 26.44% { opacity: 0.3; } 30%, 100% { opacity: 0; } }
    /* m3: the host answers on the same socket */
    @keyframes m3 {
      0%, 30% { transform: translate(0, 0); opacity: 0; }
      30.67% { opacity: 1; }
      35.56% { transform: translate(180px, 0px); opacity: 1; }
      36.89%, 100% { transform: translate(180px, 0px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 35.56% { transform: scale(0.4); opacity: 0; } 36% { transform: scale(0.5); opacity: 0.8; } 41.11%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 35.56% { opacity: 0; } 36.44% { opacity: 0.3; } 40%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 50% { opacity: 0; } 51.11%, 80% { opacity: 1; } 81.11%, 100% { opacity: 0; } }
    /* m4: a stream event pushed by the host */
    @keyframes m4 {
      0%, 53.33% { transform: translate(0, 0); opacity: 0; }
      54% { opacity: 1; }
      60% { transform: translate(180px, 0px); opacity: 1; }
      61.33%, 100% { transform: translate(180px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 60% { transform: scale(0.4); opacity: 0; } 60.44% { transform: scale(0.5); opacity: 0.8; } 65.56%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 60% { opacity: 0; } 60.89% { opacity: 0.3; } 64.44%, 100% { opacity: 0; } }
    /* m5: another event, same socket */
    @keyframes m5 {
      0%, 61.11% { transform: translate(0, 0); opacity: 0; }
      61.78% { opacity: 1; }
      67.78% { transform: translate(180px, 0px); opacity: 1; }
      69.11%, 100% { transform: translate(180px, 0px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 67.78% { transform: scale(0.4); opacity: 0; } 68.22% { transform: scale(0.5); opacity: 0.8; } 73.33%, 100% { transform: scale(1.4); opacity: 0; } }
    /* m6: and another */
    @keyframes m6 {
      0%, 68.89% { transform: translate(0, 0); opacity: 0; }
      69.56% { opacity: 1; }
      75.56% { transform: translate(180px, 0px); opacity: 1; }
      76.89%, 100% { transform: translate(180px, 0px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 75.56% { transform: scale(0.4); opacity: 0; } 76% { transform: scale(0.5); opacity: 0.8; } 81.11%, 100% { transform: scale(1.4); opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="351" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">THE SHAPE OF THE THING</text>
  <text class="t-sub" x="28" y="66">One document over HTTP, then everything over a WebSocket on the same origin.</text>

  <!-- zone: the machine -->
  <rect x="28" y="104" width="604" height="180" rx="12" fill="none" stroke="#363840" stroke-dasharray="4 4"/>
  <text class="t-zone" x="44" y="122">YOUR MACHINE · 127.0.0.1 : EPHEMERAL PORT</text>

  <!-- connectors -->
  <g stroke="#363840">
    <line x1="260" y1="176" x2="440" y2="176"/>
    <line x1="260" y1="224" x2="440" y2="224"/>
  </g>
  <g fill="#363840">
    <polygon points="434,173 440,176 434,179"/>
    <polygon points="266,173 260,176 266,179"/>
    <polygon points="434,221 440,224 434,227"/>
  </g>
  <text class="t-small" x="350" y="166" text-anchor="middle">WS · BOTH WAYS</text>
  <text class="t-small" x="350" y="214" text-anchor="middle">HTTP · ONE DOCUMENT</text>

  <!-- the executable -->
  <rect x="60" y="144" width="200" height="120" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="74" cy="161" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="84" y="164">THE EXECUTABLE</text>
  <rect x="72" y="176" width="176" height="24" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-small" x="84" y="191">BUN RUNTIME</text>
  <rect x="72" y="204" width="176" height="24" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-small" x="84" y="219">YOUR HOST CODE</text>
  <rect x="72" y="232" width="176" height="24" rx="6" fill="#0D0D0E" stroke="#363840"/>
  <text class="t-small" x="84" y="247">THE UI · EMBEDDED AS TEXT</text>

  <!-- the browser -->
  <rect x="440" y="152" width="160" height="96" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="454" cy="197" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="464" y="200">BROWSER</text>
  <text class="t-desc" x="452" y="220">your UI · one document</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="308" text-anchor="middle">No server to run, no container, no packaged Chromium. Nothing leaves the machine.</text>

  <!-- @motion:elements -->
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · SERVE</text>
  <g class="pkt" style="animation-name:m1">
    <circle cx="260" cy="224" r="4" fill="#4CF490"/>
    <text class="t-tag" x="260" y="238" text-anchor="middle" fill="#4CF490">DOCUMENT</text>
  </g>
  <circle cx="440" cy="224" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="440" y="152" width="160" height="96" rx="6" fill="#4CF490" class="glow" style="animation-name:m1-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph2;opacity:0">2 · CALL</text>
  <g class="pkt" style="animation-name:m2">
    <circle cx="440" cy="176" r="4" fill="#4CF490"/>
    <text class="t-tag" x="440" y="190" text-anchor="middle" fill="#4CF490">CALL</text>
  </g>
  <circle cx="260" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="60" y="144" width="200" height="120" rx="6" fill="#4CF490" class="glow" style="animation-name:m2-glow"/>
  <g class="pkt" style="animation-name:m3">
    <circle cx="260" cy="176" r="4" fill="#4CF490"/>
    <text class="t-tag" x="260" y="190" text-anchor="middle" fill="#4CF490">RESULT</text>
  </g>
  <circle cx="440" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="440" y="152" width="160" height="96" rx="6" fill="#4CF490" class="glow" style="animation-name:m3-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph3;opacity:0">3 · STREAM</text>
  <g class="pkt" style="animation-name:m4">
    <circle cx="260" cy="176" r="4" fill="#4CF490"/>
    <text class="t-tag" x="260" y="190" text-anchor="middle" fill="#4CF490">EVENT</text>
  </g>
  <circle cx="440" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="440" y="152" width="160" height="96" rx="6" fill="#4CF490" class="glow" style="animation-name:m4-glow"/>
  <g class="pkt" style="animation-name:m5">
    <circle cx="260" cy="176" r="4" fill="#4CF490"/>
    <text class="t-tag" x="260" y="190" text-anchor="middle" fill="#4CF490">EVENT</text>
  </g>
  <circle cx="440" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <g class="pkt" style="animation-name:m6">
    <circle cx="260" cy="176" r="4" fill="#4CF490"/>
    <text class="t-tag" x="260" y="190" text-anchor="middle" fill="#4CF490">EVENT</text>
  </g>
  <circle cx="440" cy="176" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="328" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="332">HTTP AND WEBSOCKET TRAFFIC · SAME ORIGIN</text>
</svg>
