<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autoapp-architecture-title autoapp-architecture-desc">
      <title id="autoapp-architecture-title">Autoapp architecture</title>
      <desc id="autoapp-architecture-desc">Architecture showing a browser with a launcher tab and an application tab, a launcher process holding the AI engineer, the execution gate, the knowledge store and the candidate builder, a model provider reached by the engineer, and per-application disk state and a child process that serves the application tab.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ZONES (painted first) -->
      <rect x="352" y="40" width="576" height="112" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="364" y="44" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER</text>

      <rect x="32" y="184" width="688" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="44" y="188" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="197" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LAUNCHER PROCESS</text>

      <rect x="32" y="376" width="896" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="44" y="380" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="100" y="389" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PER APPLICATION</text>

      <!-- ARROWS (before nodes) -->
      <!-- 1 Launcher tab -> AI engineer: ai.chat over Brobridge -->
      <path d="M400,128 V208 Q400,216 392,216 H296 Q288,216 288,224 V232" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="320" y="196" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="344" y="205" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AI.CHAT</text>

      <!-- 2 Launcher tab -> Gate: the person's clicks, channel user -->
      <line x1="480" y1="128" x2="480" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="488" y="176" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">USER</text>

      <!-- 3 AI engineer -> Gate: tool calls, channel ai -->
      <line x1="352" y1="256" x2="408" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="236" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AI</text>

      <!-- 4 Gate -> Candidate builder: allowed or confirmed writes -->
      <line x1="528" y1="256" x2="584" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="540" y="236" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="556" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALLOW</text>

      <!-- 5 Knowledge store -> AI engineer: orientation, evidence, lessons -->
      <line x1="176" y1="244" x2="232" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="188" y="224" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="204" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SERVE</text>

      <!-- 6 AI engineer -> Knowledge store: events and cases -->
      <line x1="232" y1="280" x2="176" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="188" y="260" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="204" y="269" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORD</text>

      <!-- 7 AI engineer -> Model provider -->
      <path d="M248,232 V208 Q248,200 240,200 H160 Q152,200 152,192 V128" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="172" y="180" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="196" y="189" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODEL</text>

      <!-- 8 Candidate builder -> Disk: an immutable release directory -->
      <path d="M616,296 V348 Q616,356 608,356 H232 Q224,356 224,364 V424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="400" y="336" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="420" y="345" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEASE</text>

      <!-- 9 Candidate builder -> Application child: spawn, migrate, IPC -->
      <line x1="672" y1="296" x2="672" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="680" y="352" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="698" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN</text>

      <!-- 10 Application child -> Application tab: its own Brobridge port -->
      <line x1="760" y1="424" x2="760" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="768" y="272" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="281" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BROBRIDGE</text>

      <!-- 11 Application child -> Disk: data and runs.sqlite -->
      <line x1="640" y1="456" x2="336" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="460" y="436" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="445" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DATA·RUNS</text>

      <!-- NODES -->
      <!-- Model provider (external) -->
      <rect x="32" y="72" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="32" y="72" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="40" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="54" y="87" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="152" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model provider</text>
      <text x="152" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ollama local · Anthropic / OpenAI remote</text>

      <!-- Launcher tab -->
      <rect x="384" y="72" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="72" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="392" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.60)" stroke-width="0.8"/>
      <text x="406" y="87" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAB</text>
      <text x="504" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Launcher tab</text>
      <text x="504" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">engineer chat · candidate panel · approvals</text>

      <!-- Application tab -->
      <rect x="672" y="72" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="72" width="240" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="680" y="78" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.60)" stroke-width="0.8"/>
      <text x="694" y="87" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TAB</text>
      <text x="792" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application tab</text>
      <text x="792" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pinned renderer over views.ts</text>

      <!-- Knowledge store (focal) -->
      <rect x="56" y="232" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="232" width="120" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="64" y="238" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="84" y="247" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQLITE</text>
      <text x="116" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Knowledge</text>
      <text x="116" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cases · lessons</text>

      <!-- AI engineer -->
      <rect x="232" y="232" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="232" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="238" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="254" y="247" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
      <text x="292" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AI engineer</text>
      <text x="292" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proposes, never applies</text>

      <!-- Execution gate (focal) -->
      <rect x="408" y="232" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="232" width="120" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="416" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="432" y="247" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="468" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execution gate</text>
      <text x="468" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">channel × effect</text>

      <!-- Candidate builder -->
      <rect x="584" y="232" width="120" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="584" y="232" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="592" y="238" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="610" y="247" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUILD</text>
      <text x="644" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Candidate</text>
      <text x="644" y="282" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">build → activate</text>

      <!-- Disk (store) -->
      <rect x="96" y="424" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="96" y="424" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="104" y="430" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="120" y="439" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
      <text x="216" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application state</text>
      <text x="216" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">releases · source · data/ · runs.sqlite</text>

      <!-- Application child -->
      <rect x="640" y="424" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="424" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="430" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="666" y="439" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHILD</text>
      <text x="760" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application child</text>
      <text x="760" y="474" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Bun.spawn · trusted local code · own port</text>

      <!-- LEGEND -->
      <line x1="32" y1="548" x2="928" y2="548" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="104" y="556" width="12" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="124" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL · the two decisions</text>

      <rect x="288" y="556" width="12" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="308" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PROCESS</text>

      <rect x="384" y="556" width="12" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="404" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STORE</text>

      <rect x="464" y="556" width="12" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="484" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">BROWSER TAB</text>

      <rect x="584" y="556" width="12" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="604" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL</text>

      <line x1="688" y1="560" x2="712" y2="560" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="720" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">LOOPBACK / HTTP</text>

      <line x1="832" y1="560" x2="856" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="864" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">IN-PROCESS</text>
    </svg>
