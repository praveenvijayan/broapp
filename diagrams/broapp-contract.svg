<svg xmlns="http://www.w3.org/2000/svg" width="660" height="352" viewBox="0 0 660 352" fill="none" role="img" aria-label="The contract: the host and the UI both import shared/contract.ts, which holds schemas and no implementation; when the bundler follows the browser's import it reaches the contract and stops, so no host code is pulled into the browser bundle; a browser import of src/host is refused and the build fails.">
  <style>
    /* ---- type ramp (dark skin) --------------------------------------- */
    text { font-family: 'Source Code Pro', ui-monospace, Menlo, Consolas, monospace; }
    .t-title { font-size: 17px; font-weight: 700; letter-spacing: 2px; fill: #F4F6FC; }
    .t-sub   { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; fill: #6F7987; }
    .t-zone  { font-size: 9px; letter-spacing: 1.5px; fill: #6F7987; }
    .t-name  { font-size: 9px; letter-spacing: 1px; fill: #B6C0CF; }
    .t-small { font-size: 8px; letter-spacing: 1px; fill: #6F7987; }
    .t-desc  { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 8.5px; fill: #6F7987; }
    .t-tag   { font-size: 7.5px; font-weight: 600; letter-spacing: 1px; }
    .t-prose { font-family: Inter, -apple-system, 'Segoe UI', sans-serif; font-size: 10px; fill: #6F7987; }
    .t-badge { font-size: 8.5px; font-weight: 600; letter-spacing: 1px; fill: #A880FF; }

    /* ---- motion base classes ----------------------------------------- */
    .pkt   { animation-timing-function: linear; animation-iteration-count: infinite; }
    .story { animation-timing-function: linear; animation-iteration-count: infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .glow  { opacity: 0; animation-timing-function: linear; animation-iteration-count: infinite; }
    .bar   { transform-box: fill-box; transform-origin: left;
             animation-timing-function: linear; animation-iteration-count: infinite; }
    .tick  { animation: tick 2.6s ease-in-out infinite; }
    @keyframes tick { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* @motion:css */
    /* generated by timeline.py — loop 9s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 9s; }
    /* ph1: act 1 */
    @keyframes ph1 { 0%, 26.67% { opacity: 1; } 27.78%, 100% { opacity: 0; } }
    /* m1: the host imports the schemas */
    @keyframes m1 {
      0%, 4.44% { transform: translate(0, 0); opacity: 0; }
      5.11% { opacity: 1; }
      6.13% { transform: translate(0px, 32px); }
      12.76% { transform: translate(-126px, 32px); }
      14.44% { transform: translate(-126px, 64px); opacity: 1; }
      15.78%, 100% { transform: translate(-126px, 64px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 14.44% { transform: scale(0.4); opacity: 0; } 14.89% { transform: scale(0.5); opacity: 0.8; } 20%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 14.44% { opacity: 0; } 15.33% { opacity: 0.3; } 18.89%, 100% { opacity: 0; } }
    /* m2: so does the ui, at the same time */
    @keyframes m2 {
      0%, 4.44% { transform: translate(0, 0); opacity: 0; }
      5.11% { opacity: 1; }
      6.13% { transform: translate(0px, 32px); }
      12.76% { transform: translate(126px, 32px); }
      14.44% { transform: translate(126px, 64px); opacity: 1; }
      15.78%, 100% { transform: translate(126px, 64px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 14.44% { transform: scale(0.4); opacity: 0; } 14.89% { transform: scale(0.5); opacity: 0.8; } 20%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 14.44% { opacity: 0; } 15.33% { opacity: 0.3; } 18.89%, 100% { opacity: 0; } }
    /* ph2: act 2 */
    @keyframes ph2 { 0%, 30% { opacity: 0; } 31.11%, 62.22% { opacity: 1; } 63.33%, 100% { opacity: 0; } }
    /* m3: the bundler follows the browser's import up to the contract */
    @keyframes m3 {
      0%, 33.33% { transform: translate(0, 0); opacity: 0; }
      34% { opacity: 1; }
      35.02% { transform: translate(0px, -32px); }
      41.65% { transform: translate(-126px, -32px); }
      43.33% { transform: translate(-126px, -64px); opacity: 1; }
      44.67%, 100% { transform: translate(-126px, -64px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 43.33% { transform: scale(0.4); opacity: 0; } 43.78% { transform: scale(0.5); opacity: 0.8; } 48.89%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 43.33% { opacity: 0; } 44.22% { opacity: 0.3; } 47.78%, 100% { opacity: 0; } }
    /* stops: no implementation, so nothing further to pull in */
    @keyframes stops { 0%, 42.22% { opacity: 0; } 43.33%, 62.22% { opacity: 1; } 63.33%, 100% { opacity: 0; } }
    /* ph3: act 3 */
    @keyframes ph3 { 0%, 64.44% { opacity: 0; } 65.56%, 88.89% { opacity: 1; } 90%, 100% { opacity: 0; } }
    /* m4: browser code that imports src/host is caught by the build */
    @keyframes m4 {
      0%, 66.67% { transform: translate(0, 0); opacity: 0; }
      67.33% { opacity: 1; }
      75.56% { transform: translate(-180px, 0px); opacity: 1; }
      76.89%, 100% { transform: translate(-180px, 0px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 75.56% { transform: scale(0.4); opacity: 0; } 76% { transform: scale(0.5); opacity: 0.8; } 81.11%, 100% { transform: scale(1.4); opacity: 0; } }
    /* fails: the build refuses to emit the page */
    @keyframes fails { 0%, 74.44% { opacity: 0; } 75.56%, 88.89% { opacity: 1; } 90%, 100% { opacity: 0; } }
    /* @/motion:css */

    @media (prefers-reduced-motion: reduce) {
      .pkt, .ring, .glow { animation: none !important; visibility: hidden; }
      .story { animation: none !important; }
      text.story { visibility: hidden; }      /* stacked captions would overprint */
      .bar   { animation: none !important; transform: scaleX(1); }
      .tick  { animation: none !important; }
    }
  </style>

  <!-- frame -->
  <rect x="0.5" y="0.5" width="659" height="351" rx="12" fill="#0D0D0E" stroke="#202126"/>
  <text class="t-title" x="28" y="42">THE CONTRACT</text>
  <text class="t-sub" x="28" y="66">Both sides import the schemas; neither side imports the other.</text>

  <!-- connectors -->
  <g stroke="#363840">
    <path d="M296,160 V184 Q296,192 288,192 H178 Q170,192 170,200 V224"/>
    <path d="M364,160 V184 Q364,192 372,192 H482 Q490,192 490,200 V224"/>
    <line x1="240" y1="252" x2="420" y2="252" stroke-dasharray="4 3"/>
  </g>
  <g fill="#363840">
    <polygon points="167,218 170,224 173,218"/>
    <polygon points="487,218 490,224 493,218"/>
    <polygon points="246,249 240,252 246,255"/>
  </g>
  <text class="t-small" x="180" y="214">IMPORTS</text>
  <text class="t-small" x="480" y="214" text-anchor="end">IMPORTS</text>

  <!-- contract -->
  <rect x="248" y="104" width="164" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="262" cy="121" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.0s"/>
  <text class="t-name" x="272" y="124">CONTRACT</text>
  <text class="t-desc" x="260" y="144">shared/contract.ts · schemas only</text>

  <!-- host -->
  <rect x="100" y="224" width="140" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="114" cy="241" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-0.7s"/>
  <text class="t-name" x="124" y="244">HOST</text>
  <text class="t-desc" x="112" y="264">host/ · implementations</text>

  <!-- ui -->
  <rect x="420" y="224" width="140" height="56" rx="7" fill="#141416" stroke="#363840"/>
  <circle cx="434" cy="241" r="2.5" fill="#4CF490" class="tick" style="animation-delay:-1.4s"/>
  <text class="t-name" x="444" y="244">UI</text>
  <text class="t-desc" x="432" y="264">ui/ · components</text>

  <!-- state marks -->
  <text class="t-tag story" x="248" y="96" fill="#4CF490" style="animation-name:stops;opacity:0">STOPS HERE · NO IMPLEMENTATION TO FOLLOW</text>
  <text class="t-tag story" x="330" y="268" text-anchor="middle" fill="#FF9E9E" style="animation-name:fails;opacity:0">BUILD FAILS · NO PAGE EMITTED</text>

  <!-- caption -->
  <text class="t-prose" x="330" y="308" text-anchor="middle">Host code, host configuration and host secrets stay out of the browser bundle because there is nothing to follow.</text>

  <!-- @motion:elements -->
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph1;opacity:0">1 · IMPORT</text>
  <g class="pkt" style="animation-name:m1">
    <circle cx="296" cy="160" r="4" fill="#4CF490"/>
    <text class="t-tag" x="296" y="148" text-anchor="middle" fill="#4CF490">SCHEMAS</text>
  </g>
  <circle cx="170" cy="224" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="100" y="224" width="140" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m1-glow"/>
  <g class="pkt" style="animation-name:m2">
    <circle cx="364" cy="160" r="4" fill="#4CF490"/>
    <text class="t-tag" x="364" y="148" text-anchor="middle" fill="#4CF490">SCHEMAS</text>
  </g>
  <circle cx="490" cy="224" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="420" y="224" width="140" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m2-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#4CF490" style="animation-name:ph2;opacity:0">2 · BUNDLE</text>
  <g class="pkt" style="animation-name:m3">
    <circle cx="490" cy="224" r="4" fill="#4CF490"/>
    <text class="t-tag" x="490" y="212" text-anchor="middle" fill="#4CF490">RESOLVE</text>
  </g>
  <circle cx="364" cy="160" r="10" fill="none" stroke="#4CF490" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="248" y="104" width="164" height="56" rx="6" fill="#4CF490" class="glow" style="animation-name:m3-glow"/>
  <text class="t-tag story" x="632" y="96" text-anchor="end" fill="#FF9E9E" style="animation-name:ph3;opacity:0">3 · REFUSED</text>
  <g class="pkt" style="animation-name:m4">
    <circle cx="420" cy="252" r="4" fill="#FF9E9E"/>
    <text class="t-tag" x="420" y="240" text-anchor="middle" fill="#FF9E9E">IMPORT SRC/HOST</text>
  </g>
  <circle cx="240" cy="252" r="10" fill="none" stroke="#FF9E9E" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <!-- @/motion:elements -->

  <!-- legend strip -->
  <circle cx="36" cy="328" r="4" fill="#4CF490"/>
  <text class="t-name" x="46" y="332">IMPORTS THE BUNDLER FOLLOWS</text>
  <circle cx="276" cy="328" r="4" fill="#FF9E9E"/>
  <text class="t-name" x="286" y="332">IMPORT OF SRC/HOST · REFUSED</text>
</svg>
