<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autoapp-task-links-title autoapp-task-links-desc">
      <title id="autoapp-task-links-title">The relationship index</title>
      <desc id="autoapp-task-links-desc">Five kinds of recorded thing, task, run, file, case and lesson, joined by nine relations each read from one stored row: a task ran as runs, runs and tasks edited files, a task planned files, a case was opened and resolved in runs and edited files, and a lesson was distilled from a case and served to runs.</desc>
