name: Publish to npm

# Manually triggered only. Publication is irreversible for a given version, so
# it does not happen as a side effect of a push, a tag, or a green build.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options: [broapp, broapp-ai-anthropic, broapp-ai-compatible, create-broapp, all]
      dry_run:
        description: Run npm publish --dry-run instead of publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub environment with required reviewers, so a second person approves
    # before anything reaches the registry.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run scripts/release-dry-run.ts

      - name: Stage the template into the generator
        run: bun run scripts/stage-template.ts

      # Order matters: the provider packages and the generator depend on the
      # published broapp, so it goes first and create-broapp last.
      - name: Publish broapp
        if: inputs.package == 'broapp' || inputs.package == 'all'
        working-directory: packages/broapp
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish broapp-ai-anthropic
        if: inputs.package == 'broapp-ai-anthropic' || inputs.package == 'all'
        working-directory: packages/broapp-ai-anthropic
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish broapp-ai-compatible
        if: inputs.package == 'broapp-ai-compatible' || inputs.package == 'all'
        working-directory: packages/broapp-ai-compatible
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-broapp
        if: inputs.package == 'create-broapp' || inputs.package == 'all'
        working-directory: packages/create-broapp
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
