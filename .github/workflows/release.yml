name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      example:
        description: Example to build binaries for
        required: false
        default: notes

permissions:
  contents: write

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests
      - run: bun run scripts/release-dry-run.ts
      - run: bun run scripts/autoapp-dry-run.ts

  # Built where they run. A cross-compiled binary would be faster to produce and
  # would not have been executed by anything, which is exactly what a release
  # must not ship unverified.
  binaries:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64, native: true }
          # `macos-13` was the last hosted Intel runner and is retired: a job
          # asking for it queued for ten hours and was cancelled by GitHub,
          # which cancelled the draft with it — on v0.3.0 and again on v0.3.1.
          # Intel macOS is cross-compiled and labelled, but on a Mac: only
          # there can the build give it a signature that verifies, and Apple
          # silicon kills a binary whose signature does not.
          - { os: macos-latest, target: darwin-x64, native: false }
          - { os: ubuntu-latest, target: linux-x64, native: true }
          - { os: windows-latest, target: windows-x64, native: true }
          # No hosted runner for these, so they are cross-compiled and labelled.
          - { os: ubuntu-latest, target: linux-arm64, native: false }
          - { os: ubuntu-latest, target: linux-x64-musl, native: false }
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile

      - name: Build
        working-directory: examples/${{ github.event.inputs.example || 'notes' }}
        run: bun run build -- --target ${{ matrix.target }}

      - name: Smoke test (native only)
        if: matrix.native
        working-directory: examples/${{ github.event.inputs.example || 'notes' }}
        shell: bash
        run: |
          name=${{ github.event.inputs.example || 'notes' }}
          binary="./release/${name}-${{ matrix.target }}"
          [ -f "$binary.exe" ] && binary="$binary.exe"
          bun run ../../scripts/smoke-binary.ts "$binary"

      # The build signs a macOS binary ad hoc; this is the check that it did.
      # A runner's macOS may still start a binary whose signature is broken,
      # so a passing smoke test above is not evidence of this.
      - name: Verify the macOS signature
        if: startsWith(matrix.target, 'darwin-')
        working-directory: examples/${{ github.event.inputs.example || 'notes' }}
        run: codesign --verify --strict --verbose=2 "./release/${{ github.event.inputs.example || 'notes' }}-${{ matrix.target }}"

      - name: Archive
        working-directory: examples/${{ github.event.inputs.example || 'notes' }}
        shell: bash
        run: |
          name=${{ github.event.inputs.example || 'notes' }}
          cd release
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            # Zip does not carry a Unix executable bit, but Windows does not
            # need one. Every other target ships a tarball for that reason.
            7z a "${name}-${{ matrix.target }}.zip" "${name}-${{ matrix.target }}.exe"
          else
            chmod +x "${name}-${{ matrix.target }}"
            tar -czf "${name}-${{ matrix.target }}.tar.gz" "${name}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            examples/*/release/*.tar.gz
            examples/*/release/*.zip
          if-no-files-found: error

  # The launcher is one binary for every application on a machine, so it is
  # built once per target rather than once per example. Cross-compiled from
  # Linux, because `bun build --compile` can target every platform from one —
  # and then labelled as compiled-but-not-executed, exactly as the examples are.
  # Every target but macOS: those are built by `launcher-macos`, below.
  launcher:
    name: Launcher — Linux and Windows targets
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build every target but macOS
        working-directory: packages/broapp-autoapp
        run: bun run scripts/build-launcher.ts --all-targets --skip-macos
      - name: Archive
        working-directory: packages/broapp-autoapp/dist
        shell: bash
        run: |
          for file in broapp-autoapp-*; do
            case "$file" in
              *.tar.gz|*.zip) continue ;;
              *.exe) 7z a "${file%.exe}.zip" "$file" ;;
              *) chmod +x "$file"; tar -czf "$file.tar.gz" "$file" ;;
            esac
          done
      # A launcher can only import a source workspace, and somebody who
      # downloaded a binary has no repository to take one from. The starter is
      # the Notes example with its dependencies pointed at the published
      # packages, so `import` installs them from npm.
      - name: Starter workspace
        run: |
          bun run scripts/autoapp-starter.ts packages/broapp-autoapp/dist
          cd packages/broapp-autoapp/dist
          zip -qr notes-starter.zip notes-starter
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: |
            packages/broapp-autoapp/dist/*.tar.gz
            packages/broapp-autoapp/dist/*.zip
          if-no-files-found: error

  # The macOS launchers, built on a Mac so they can be signed. Bun 1.4.0 leaves
  # every macOS binary with a signature that does not verify, and macOS 27 kills
  # such a binary on Apple silicon before it prints anything: v0.4.27 shipped a
  # launcher that did exactly that. The build script signs ad hoc; the step
  # after it checks, because the runner's macOS may start a broken binary anyway.
  # The Apple silicon binary smoke-tested is the one archived, not a second build.
  launcher-macos:
    name: Launcher — macOS targets
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build the macOS targets
        working-directory: packages/broapp-autoapp
        run: bun run scripts/build-launcher.ts --all-targets --only-macos
      - name: Verify the signatures
        working-directory: packages/broapp-autoapp/dist
        run: |
          for file in broapp-autoapp-darwin-*; do
            codesign --verify --strict --verbose=2 "$file"
          done
      # `autoapp-smoke.ts` drives `dist/broapp-autoapp`, so the shipped binary
      # is copied to that name rather than a native one built beside it.
      - name: Smoke test the Apple silicon binary
        run: |
          cp packages/broapp-autoapp/dist/broapp-autoapp-darwin-arm64 packages/broapp-autoapp/dist/broapp-autoapp
          bun run scripts/autoapp-smoke.ts
      - name: Archive
        working-directory: packages/broapp-autoapp/dist
        run: |
          for file in broapp-autoapp-darwin-*; do
            case "$file" in *.tar.gz) continue ;; esac
            chmod +x "$file"
            tar -czf "$file.tar.gz" "$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-macos
          path: packages/broapp-autoapp/dist/*.tar.gz
          if-no-files-found: error

  # The evidence for the launcher on Linux and Windows: build it natively and
  # drive the compiled binary through import, serve, the control connection,
  # activation, a crash past the switch, and recovery. macOS is smoke-tested in
  # `launcher-macos`, on the binary it ships.
  launcher-smoke:
    name: Launcher smoke — ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/broapp-autoapp build:launcher
      - run: bun run scripts/autoapp-smoke.ts

  draft:
    name: Draft release
    needs: [binaries, launcher, launcher-macos, launcher-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          # Draft, always. Publishing is a human decision, and these binaries
          # are unsigned — see docs/packaging.md for what that means on each
          # platform.
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            ## Verification

            | Target | Compiled | Executed in CI |
            | --- | --- | --- |
            | darwin-arm64 | yes | yes |
            | darwin-x64 | yes | **no** — cross-compiled on macOS, no Intel runner |
            | linux-x64 | yes | yes |
            | windows-x64 | yes | yes |
            | linux-arm64 | yes | **no** — cross-compiled, no runner |
            | linux-x64-musl | yes | **no** — cross-compiled, no runner |

            The `broapp-autoapp-<target>` archives are the Autoapp launcher,
            which supervises applications and hosts the engineer. The two
            macOS ones are built on macOS and signed ad hoc there; the rest are
            cross-compiled from Linux. The launcher is smoke-tested on
            linux-x64, darwin-arm64 (the archived binary itself) and
            windows-x64, and compiled only on the other three targets. It runs
            applications as **trusted local code**: crash isolated from the
            launcher, not permission isolated from you. See `docs/autoapp/packaging.md` and
            `docs/autoapp/security.md`.

            Binaries carry **no developer identity**. The macOS ones are signed
            ad hoc, which is what lets Apple silicon start them at all; it does
            not satisfy Gatekeeper, so a browser download still needs the
            quarantine removed (below). Windows will show SmartScreen. See
            `docs/packaging.md`.

            ## Getting started with the launcher

            Download `broapp-autoapp-<target>` for your machine, unpack it, and
            run it with no arguments. It opens its own tab; press **New
            application**, give it a name, and the launcher writes a starter
            application to disk, installs its dependencies from npm (the one
            time it reaches the network), builds it, makes it current and opens
            it. `create <appId>` does the same from a terminal.

            ```
            curl -fsSL https://github.com/praveenvijayan/broapp/releases/latest/download/broapp-autoapp-darwin-arm64.tar.gz | tar xz
            ./broapp-autoapp-darwin-arm64
            ```

            **Downloaded with a browser instead?** macOS quarantines the file
            and, because the binary carries no Apple developer identity,
            Gatekeeper calls it "damaged" and offers only the bin. It is not
            damaged. Remove the tag and run it:

            ```
            xattr -d com.apple.quarantine broapp-autoapp-darwin-arm64
            ```

            Windows shows SmartScreen for the same reason: *More info*, then
            *Run anyway*.

            For a fuller starting point, `notes-starter.zip` is the Notes
            example with its AI panel, its dependencies pointed at the
            published packages. Unpack it beside the launcher:

            ```
            tar -xzf broapp-autoapp-darwin-arm64.tar.gz      # or unzip the .zip on Windows
            unzip notes-starter.zip
            xattr -d com.apple.quarantine broapp-autoapp-darwin-arm64   # macOS only
            ./broapp-autoapp-darwin-arm64 import ./notes-starter --as notes --grant
            ./broapp-autoapp-darwin-arm64 serve notes
            ```

            `import` installs the starter's dependencies from npm — the one
            time the launcher reaches the network — builds the first release
            and makes it current. `serve` starts it as its own process and
            opens a browser tab.

            To change it, run the launcher with no arguments for its own tab,
            pick a model provider in its settings, and describe the change; the
            engineer proposes an edit, the launcher builds a candidate, and you
            preview and activate it. Or edit the workspace under the launcher's
            data directory yourself and run `build notes`. `--help` lists every
            command; `docs/autoapp/design.md` explains the loop.

            Check downloads against `SHA256SUMS`:

            ```
            sha256sum -c SHA256SUMS --ignore-missing
            ```
