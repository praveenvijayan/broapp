name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test tests

  examples:
    name: Example — ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [dashboard, file-processor, notes]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: examples/${{ matrix.example }}
        run: bunx tsc --noEmit
      - name: Test
        working-directory: examples/${{ matrix.example }}
        # Not every example has tests; run them only where they exist.
        run: |
          if [ -d tests ]; then bun test tests; else echo "no tests"; fi
      - name: Build
        working-directory: examples/${{ matrix.example }}
        run: bun run build
      - name: Smoke test the native binary
        working-directory: examples/${{ matrix.example }}
        run: bun run ../../scripts/smoke-binary.ts ./release/${{ matrix.example }}

  dry-run:
    name: Release dry run — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # Packs the publishable packages, generates a project *outside* the
      # workspace from the packed tarballs, builds it, and runs the compiled
      # binary from an unrelated directory. This is the check that catches a
      # package that works from the monorepo and not from npm.
      - run: bun run scripts/release-dry-run.ts
      # The same check for the launcher: install the packed packages outside the
      # workspace, import the Notes workspace through them, and build a
      # candidate. It catches a `files` list that omits the launcher's page and
      # a dependency that only resolves inside this repository.
      - run: bun run scripts/autoapp-dry-run.ts

  autoapp:
    name: Autoapp — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/broapp-autoapp build:launcher
      # `autoapp-spec` is here for one case the other files cannot reach on
      # Windows: moving `current` onto an existing pointer file, which is a
      # `MoveFileEx` replacement there rather than a POSIX rename.
      # `autoapp-create` is here for the platform question the template raises:
      # it is packed with forward-slashed paths and written back out with
      # `join`, and Windows is the only place that distinction can be wrong.
      # `autoapp-knowledge` is here for three things only Windows can answer:
      # removing a preview's data copy after its child has stopped, a symlink
      # inside `src/` that the symbol index must not follow, and the `knowledge`
      # command refusing while a launcher's pid is alive.
      - run: bun test tests/autoapp-spike.test.ts tests/autoapp-spec.test.ts tests/autoapp-activation.test.ts tests/autoapp-mcp.test.ts tests/autoapp-create.test.ts tests/autoapp-knowledge.test.ts
      # Drives the compiled binary end to end — import, serve, the control
      # connection, build, activate, a crash past the switch, and recovery.
      # This is the step that catches a packaging fault the module tests
      # cannot see, because they never load the compiled artifact.
      - run: bun run scripts/autoapp-smoke.ts
      - run: bun test tests/autoapp-offline.test.ts

  theme:
    name: Theme — a browser reads the compiled page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      # One job, one browser. Chromium is a download, not a package, so it is
      # cached on the Playwright version that asked for it: a new version gets
      # a new key and a fresh download rather than a browser that does not
      # match the client.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Chromium
        run: bun x playwright install --with-deps chromium
      # The first rendered check: three themes, three schemes, the renderer's
      # button and the panel's select — opened, so its portal is measured —
      # and the contrast of every text/background pair it reads.
      - run: bun test tests/autoapp-theme-browser.test.ts
      # The same run again, for the report a person reads when it fails.
      - run: bun run theme-check
      # The gallery is the page a person looks at, so it is the page the
      # detector reads: 61 deterministic rules, no model, over every
      # text-on-background pair the harness was never told about.
      - run: bun run --cwd packages/broapp-autoapp theme-gallery
      - run: bun run design-detect
      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check
          path: |
            .broapp-tmp/theme-check.json
            .broapp-tmp/theme-check.md
          if-no-files-found: warn

  cross-compile:
    name: Cross-compile every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build all targets
        working-directory: examples/notes
        run: bun run build:all
      # Deliberately no execution step. A cross-compiled binary is built, not
      # run; claiming otherwise is the thing this repository is careful about.
      - name: Report
        working-directory: examples/notes
        run: |
          echo "Compiled (NOT executed — cross-compilation only):"
          ls -lh release/
